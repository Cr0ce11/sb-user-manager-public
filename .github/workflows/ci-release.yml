name: CI and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 jq nftables openssh-client openssl procps python3 shellcheck systemd util-linux
          shellcheck --version
      - name: Bash syntax
        run: |
          for script in sb-user-manager.sh tests/acceptance.sh tests/check-managed-step-errexit.sh tests/test-acceptance.sh tests/test-standalone-startup.sh tests/test-manager-handoff.sh tools/build-manager.sh tools/audit-public-readiness.sh tools/export-public-snapshot.sh tools/check-immutable-release-setting.sh tests/test-build.sh tests/test-public.sh tests/test-public-readiness.sh tests/test-public-snapshot.sh tests/test-release-workflow.sh; do
            bash -n "$script"
          done
      - name: Verify generated manager
        run: bash tools/build-manager.sh --check
      - name: ShellCheck
        run: |
          shellcheck -x -e SC1090,SC1091 sb-user-manager.sh tests/acceptance.sh tests/check-managed-step-errexit.sh tests/test-acceptance.sh tests/test-standalone-startup.sh tools/build-manager.sh tools/audit-public-readiness.sh tools/export-public-snapshot.sh tools/check-immutable-release-setting.sh tests/test-build.sh tests/test-public-readiness.sh tests/test-public-snapshot.sh tests/test-release-workflow.sh
          # 测试桩由动态 source 的函数间接调用，ShellCheck 无法静态追踪。
          shellcheck -x -e SC1090,SC1091,SC2034,SC2317 tests/test-public.sh tests/test-manager-handoff.sh
      - name: Static release checks
        run: bash tests/test-static.sh
      - name: Deterministic manager build checks
        run: bash tests/test-build.sh
      - name: Refactor unit checks
        run: bash tests/test-unit.sh
      - name: Standalone startup checks
        run: bash tests/test-standalone-startup.sh
      - name: Manager channel handoff checks
        run: bash tests/test-manager-handoff.sh
      - name: Acceptance harness checks
        run: bash tests/test-acceptance.sh
      - name: Public edition checks
        run: bash tests/test-public.sh
      - name: Public repository readiness audit checks
        run: bash tests/test-public-readiness.sh
      - name: Public source snapshot checks
        run: bash tests/test-public-snapshot.sh
      - name: Immutable release workflow checks
        run: bash tests/test-release-workflow.sh

  jq16-compat:
    runs-on: ubuntu-24.04
    container: debian:bookworm-20260713-slim@sha256:7b140f374b289a7c2befc338f42ebe6441b7ea838a042bbd5acbfca6ec875818
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Install Debian 12 validation tools
        run: apt-get update && apt-get install -y bash bsdextrautils ca-certificates coreutils diffutils findutils gawk git grep hostname jq openssh-client openssl python3 sed systemd tar util-linux
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Verify jq 1.6 migration compatibility
        shell: bash
        run: |
          test "$(jq --version)" = jq-1.6
          trace="$(mktemp)"
          if ! bash -x tests/test-unit.sh >"$trace" 2>&1; then
            tail -n 200 "$trace"
            exit 1
          fi
          tail -n 2 "$trace"
          rm -f "$trace"
          bash tests/test-standalone-startup.sh
          bash tests/test-manager-handoff.sh
          bash tests/test-release-workflow.sh

  debian-standalone-e2e:
    runs-on: ubuntu-24.04
    container: debian:bookworm-20260713-slim@sha256:7b140f374b289a7c2befc338f42ebe6441b7ea838a042bbd5acbfca6ec875818
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Install Debian 12 standalone validation tools
        run: apt-get update && apt-get install -y bash bsdextrautils ca-certificates coreutils diffutils findutils gawk git grep jq openssl python3 sed tar util-linux
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Verify generated manager
        shell: bash
        run: bash tools/build-manager.sh --check
      - name: Standalone startup checks on Debian 12
        shell: bash
        run: bash tests/test-standalone-startup.sh
      - name: Manager handoff checks on Debian 12
        shell: bash
        run: bash tests/test-manager-handoff.sh
      - name: Public readiness checks on Debian 12
        shell: bash
        run: bash tests/test-public-readiness.sh

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate, jq16-compat, debian-standalone-e2e]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Verify generated manager
        run: bash tools/build-manager.sh --check
      - name: Verify tag matches script and changelog
        run: |
          version="$(sed -n 's/^SCRIPT_VERSION="\([^"]*\)"/\1/p' sb-user-manager.sh | head -n1)"
          test "v$version" = "${GITHUB_REF_NAME}"
          grep -Fq "## $version " CHANGELOG.md
      - name: Build checksum
        run: sha256sum sb-user-manager.sh > sb-user-manager.sh.sha256
      - name: Verify immutable release protection
        env:
          GH_TOKEN: ${{ secrets.IMMUTABLE_RELEASES_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo '缺少 Actions Secret：IMMUTABLE_RELEASES_READ_TOKEN；拒绝创建 Release。' >&2
            exit 1
          fi
          bash tools/check-immutable-release-setting.sh "$GITHUB_REPOSITORY"
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          tag="$GITHUB_REF_NAME"
          assets=(
            sb-user-manager.sh
            sb-user-manager.sh.sha256
          )
          release_created=no
          release_published=no

          cleanup_draft() {
            local rc=$?
            trap - EXIT
            if [[ "$release_created" == yes && "$release_published" != yes ]]; then
              gh release delete "$tag" --yes >/dev/null 2>&1 || true
            fi
            exit "$rc"
          }
          trap cleanup_draft EXIT

          if gh release view "$tag" >/dev/null 2>&1; then
            printf 'Release %s 已存在；拒绝覆盖或复用同一版本。\n' "$tag" >&2
            exit 1
          fi

          gh release create "$tag" \
            --verify-tag \
            --draft \
            --title "sb-user-manager $tag" \
            --generate-notes
          release_created=yes

          gh release upload "$tag" "${assets[@]}"

          release_json=
          for attempt in 1 2 3 4 5; do
            release_json="$(gh release view "$tag" --json tagName,isDraft,isPrerelease,assets)"
            if jq -e \
              --arg tag "$tag" \
              --arg manager_digest "sha256:$(sha256sum sb-user-manager.sh | awk '{print $1}')" \
              --arg checksum_digest "sha256:$(sha256sum sb-user-manager.sh.sha256 | awk '{print $1}')" \
              -f tools/verify-release-assets.jq <<<"$release_json" >/dev/null; then
              break
            fi
            [[ "$attempt" != 5 ]] || {
              printf '草稿 Release 的附件数量或摘要校验失败；不会发布正式版本。\n' >&2
              exit 1
            }
            sleep 2
          done

          gh release edit "$tag" --draft=false --latest
          release_published=yes
          trap - EXIT
